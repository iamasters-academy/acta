name: CI

on:
  push:
  pull_request:

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:payload
      - run: npm run smoke
      - run: bash -n scripts/package-mac.sh && bash -n scripts/brand-mac-app.sh && bash -n native/build.sh && node --check scripts/package-win.mjs && node --check scripts/build-win-helper.mjs
